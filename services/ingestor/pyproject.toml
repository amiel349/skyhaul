[project]
name = "skyhaul-ingestor"
version = "0.0.0"
description = "Skyhaul telemetry ingestor: one thread, RabbitMQ to Postgres and Redis"
requires-python = ">=3.12"
dependencies = [
    "pika>=1.4.4,<2",
    "redis>=8.1.0",
    "skyhaul-contracts",
    "skyhaul-fleet-core",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
skyhaul-ingestor = "skyhaul_ingestor.__main__:main"

[tool.uv.sources]
skyhaul-contracts = { workspace = true }
skyhaul-fleet-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skyhaul_ingestor"]
