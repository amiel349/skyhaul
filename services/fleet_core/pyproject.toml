[project]
name = "skyhaul-fleet-core"
version = "0.0.0"
description = "Skyhaul fleet backend core: models, migrations, transition tables, Redis keys, settings"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.8",
    "redis>=8.1.0",
    "skyhaul-contracts",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
skyhaul-migrate = "skyhaul_fleet_core.migrate:main"

[tool.uv.sources]
skyhaul-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skyhaul_fleet_core"]
