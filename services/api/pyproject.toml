[project]
name = "skyhaul-api"
version = "0.0.0"
description = "Skyhaul fleet API"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1",
    "gunicorn>=23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skyhaul_api"]
