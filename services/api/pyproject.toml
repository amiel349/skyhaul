[project]
name = "skyhaul-api"
version = "0.0.0"
description = "Skyhaul fleet API"
requires-python = ">=3.12"
dependencies = [
    "apispec>=6.10.1",
    "argon2-cffi>=25.1",
    "flask>=3.1",
    "flask-limiter>=3.12",
    "flask-smorest>=0.47.0",
    "gunicorn>=23.0",
    "marshmallow>=4.4.0",
    "pyjwt>=2.10",
    "skyhaul-fleet-core",
]

[tool.uv.sources]
skyhaul-fleet-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skyhaul_api"]
