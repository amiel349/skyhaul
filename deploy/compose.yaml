# Local stack. Secrets come from ../.env (create it with `make env`).
# There are no default passwords: compose refuses to start if one is missing.
# Ports bind to 127.0.0.1 only, so nothing is reachable from your network.
name: skyhaul

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run make env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make env}
      POSTGRES_DB: ${POSTGRES_DB:?run make env}
      # Read by initdb.d/10-roles.sh, which runs on a fresh volume only (`make down -v`).
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?run make env}
      DB_API_PASSWORD: ${DB_API_PASSWORD:?run make env}
      DB_INGESTOR_PASSWORD: ${DB_INGESTOR_PASSWORD:?run make env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/initdb.d:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?run make env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?run make env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run make env}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies the fleet_core migrations as skyhaul_owner (the only role with DDL),
  # then exits. The API and the ingestor start after it succeeds.
  migrate:
    image: skyhaul-api:local
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    command: ["skyhaul-migrate", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://skyhaul_owner:${DB_OWNER_PASSWORD:?run make env}@postgres:5432/${POSTGRES_DB:?run make env}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # One-shot: with the admin broker user, creates skyhaul_api and skyhaul_ingestor and their
  # permissions, and declares the whole topology (ADR 0013). The API and the ingestor
  # declare nothing and start only after it succeeds.
  broker-init:
    image: skyhaul-api:local
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    command: ["flask", "--app", "skyhaul_api:create_spec_app()", "skyhaul", "broker-init"]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:?run make env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?run make env}
      AMQP_API_PASSWORD: ${AMQP_API_PASSWORD:?run make env}
      AMQP_INGESTOR_PASSWORD: ${AMQP_INGESTOR_PASSWORD:?run make env}
    depends_on:
      rabbitmq: { condition: service_healthy }
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  api:
    image: skyhaul-api:local
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    # REST and Socket.IO /fleet in one gunicorn process (Flask-SocketIO threading mode).
    environment:
      DATABASE_URL: postgresql+psycopg://skyhaul_api:${DB_API_PASSWORD:?run make env}@postgres:5432/${POSTGRES_DB:?run make env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?run make env}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?run make env}
      # The command publisher: may write to fleet.cmd only.
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: skyhaul_api
      RABBITMQ_PASSWORD: ${AMQP_API_PASSWORD:?run make env}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      broker-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }

  # One thread: RabbitMQ ingestor.telemetry -> Postgres telemetry + Redis drone:{id} (#27).
  # No published port. It may read ingestor.telemetry only and declares nothing.
  ingestor:
    build:
      context: ..
      dockerfile: services/ingestor/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://skyhaul_ingestor:${DB_INGESTOR_PASSWORD:?run make env}@postgres:5432/${POSTGRES_DB:?run make env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?run make env}@redis:6379/0
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: skyhaul_ingestor
      RABBITMQ_PASSWORD: ${AMQP_INGESTOR_PASSWORD:?run make env}
    depends_on:
      migrate: { condition: service_completed_successfully }
      broker-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Exits non-zero when it loses the broker (unacked messages are redelivered).
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Test profile only (`make sim`, or `docker compose --profile test up`). Its control API
  # is a test surface behind SIM_CONTROL_TOKEN, published on the host's 127.0.0.1 only.
  # It keeps the admin broker user in M2 (accepted, ADR 0013); its own user comes in M4.
  drone-sim:
    profiles: ["test"]
    build:
      context: ..
      dockerfile: services/drone_sim/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:?run make env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?run make env}
      SIM_CONTROL_TOKEN: ${SIM_CONTROL_TOKEN:?run make env}
      # Inside the container's own network namespace; the host side is 127.0.0.1 below.
      SIM_CONTROL_HOST: 0.0.0.0
      SIM_DEBUG_TAP: ${SIM_DEBUG_TAP:-0}
    ports:
      - "127.0.0.1:8100:8100"
    depends_on:
      rabbitmq: { condition: service_healthy }
    # 200 only while the consumer, scheduler and publisher run and both connections are open.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    stop_grace_period: 15s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  pgdata:
