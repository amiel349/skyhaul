name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs can only read the repo. Jobs that need more ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$file"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $file\$" | sha256sum -c -
          tar -xzf "$file" gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --no-banner -v .

  changes:
    # Decides which jobs below are needed (scripts/ci-changes.sh). A job skipped by `if` counts as
    # passed for branch protection, so the required check names stay the same. Pushes to main
    # always run everything.
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.f.outputs.python }}
      web: ${{ steps.f.outputs.web }}
      contracts: ${{ steps.f.outputs.contracts }}
      integration: ${{ steps.f.outputs.integration }}
      compose: ${{ steps.f.outputs.compose }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only "$BASE_SHA" HEAD | tee /dev/stderr | scripts/ci-changes.sh >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' python=true web=true contracts=true integration=true compose=true >> "$GITHUB_OUTPUT"
          fi

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    name: Python · lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not integration" --cov --cov-report=term-missing

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    name: Contracts · generated code is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
        working-directory: web
      # Regenerates in a scratch dir and compares; prints "run make contracts" on drift.
      - run: uv run python contracts/scripts/generate.py --check
      # The API's exported spec equals the contract for every implemented path.
      - run: make openapi-check

  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    # Includes the fleet_core migrations: upgrade, downgrade, repeat upgrade, alembic check.
    name: Integration · Testcontainers RabbitMQ, Postgres, Redis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m integration

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: Web · lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  compose:
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    name: Compose · config and image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate throwaway secrets
        run: ./scripts/gen-env.sh
      - name: Validate compose file
        run: docker compose --env-file .env -f deploy/compose.yaml config --quiet
      - name: Smoke test the API stack (migrate, then api and ingestor)
        run: |
          docker compose --env-file .env -f deploy/compose.yaml up -d --build --wait postgres rabbitmq redis migrate broker-init api ingestor
          curl -sf http://127.0.0.1:8000/healthz
          curl -sf http://127.0.0.1:8000/readyz
      - name: API logs on failure
        if: failure()
        run: docker compose --env-file .env -f deploy/compose.yaml logs migrate broker-init api ingestor
      - name: Smoke test the simulator (make sim)
        run: |
          make sim
          curl -sf http://127.0.0.1:8100/healthz
      - name: Simulator logs on failure
        if: failure()
        run: docker compose --env-file .env -f deploy/compose.yaml --profile test logs drone-sim
      - name: Stop the simulator
        if: always()
        run: make down
