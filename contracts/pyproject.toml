[project]
name = "skyhaul-contracts"
version = "0.0.0"
description = "Skyhaul drone message contracts: JSON Schemas, generated models and the Codec"
requires-python = ">=3.12"
dependencies = [
    "pika>=1.4.4,<2",
    "pydantic>=2.14.3,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skyhaul_contracts"]
