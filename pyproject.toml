[project]
name = "skyhaul"
version = "0.0.0"
description = "Drone delivery operations platform with a multithreaded drone simulator and an AI-assisted test automation framework"
requires-python = ">=3.12"
dependencies = ["skyhaul-api", "skyhaul-contracts", "skyhaul-drone-sim"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*", "contracts"]

[tool.uv.sources]
skyhaul-api = { workspace = true }
skyhaul-contracts = { workspace = true }
skyhaul-drone-sim = { workspace = true }

[dependency-groups]
dev = [
    # Its output is committed, so the generator is pinned exactly (ADR 0005).
    "datamodel-code-generator==0.91.0",
    "jsonschema>=4.26",
    "mypy>=1.18",
    "pip-audit>=2.10.1",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "pytest-timeout>=2.4",
    "ruff>=0.14",
    "testcontainers[rabbitmq]>=4.15",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated by `make contracts`; the drift check guards it instead of the linter.
extend-exclude = ["contracts/src/skyhaul_contracts/v1/_generated"]
# Apply the exclude even when pre-commit passes the files explicitly.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["services/*/src", "contracts/src", "contracts/scripts"]

[[tool.mypy.overrides]]
# pika ships no type information.
module = ["pika", "pika.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["services", "contracts"]
addopts = "--import-mode=importlib -ra"
markers = ["integration: needs Docker (Testcontainers); run with `make test-integration`"]
timeout = 30
